<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#171717'><link rel='manifest' href='manifest.webmanifest'><title>Acasalador</title><style>
:root{--me:#ff6b6b;--bg:#f7f4f1;--ink:#1f1d1b;--mut:#777;--card:#fff;--line:#e9e2dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{max-width:760px;margin:auto;padding:20px 16px 90px}.brand{font-size:32px;font-weight:950;letter-spacing:-1.5px}.brand i{font-style:normal;color:var(--me)}.sub{color:var(--mut);margin:3px 0 24px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 6px 20px #00000008}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;margin:6px 0;background:#fff;font:inherit}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800;font:inherit;cursor:pointer}.primary{background:var(--me);color:#fff}.ghost{background:#eee9e5}.row{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none}.choice{width:100%;text-align:left;background:white;border:1px solid var(--line);padding:15px;border-radius:14px;margin:6px 0}.dots{display:flex;gap:6px;margin:15px 0}.dot{width:8px;height:8px;background:#ddd;border-radius:50%}.dot.on{background:var(--me)}.colors{display:flex;gap:12px;flex-wrap:wrap}.color{width:42px;height:42px;border-radius:50%;border:4px solid white;box-shadow:0 0 0 1px #ddd}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;text-align:left;font-weight:800}.tile b{font-size:25px;display:block;margin-bottom:8px}.tag{display:inline-block;border-radius:999px;padding:5px 9px;background:#f1ece8;font-size:12px}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:58px;padding:6px;font-size:12px}.mark{width:7px;height:7px;background:var(--me);border-radius:50%;display:inline-block;margin:2px}.moneytabs{display:flex;gap:8px}.moneytabs button{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px;display:flex;justify-content:center}.bottom div{max-width:760px;width:100%;display:flex;justify-content:space-around}.bottom button{border:0;background:none;font-size:20px}.notice{border-left:4px solid var(--me);padding-left:12px}.small{font-size:12px;color:var(--mut)}
</style></head><body><main>
<section id='login'><div class='brand'>Acasal<i>ador</i> 💞</div><p class='sub'>Organiza o que vocês vivem, devem, planejam e esquecem.</p><div class='card'><h2>Crie sua conta</h2><input class='field' id='name' autocomplete='name' placeholder='Seu nome'><input class='field' id='phone' autocomplete='tel' inputmode='tel' placeholder='Telefone'><input class='field' id='email' autocomplete='email' inputmode='email' placeholder='E-mail'><input class='field' id='pass' autocomplete='new-password' type='password' placeholder='Crie uma senha'><button class='btn primary' onclick='start()'>Continuar</button><p class='small'>Protótipo: os dados ficam somente neste aparelho nesta versão.</p></div></section>
<section id='onboard' class='hide'><button class='btn ghost' onclick='prev()'>← Voltar</button><div class='dots' id='dots'></div><div id='q'></div></section>
<section id='app' class='hide'><div class='brand'>Acasal<i>ador</i></div><p class='sub' id='hello'></p><div class='card notice' id='invite'><b>Agora convide quem está com você 💌</b><p class='small'>Cada pessoa terá sua própria conta, cor e privacidade.</p><button class='btn primary' onclick='shareInvite()'>Compartilhar convite</button></div><div class='grid'><button class='tile' onclick="page('agenda')"><b>📅</b>Nossa agenda</button><button class='tile' onclick="page('dinheiro')"><b>💰</b>Nosso dinheiro</button><button class='tile' onclick="page('lugares')"><b>📍</b>Nossos lugares</button><button class='tile' onclick="page('lembretes')"><b>🔔</b>Pedidos e lembretes</button><button class='tile' onclick="page('compras')"><b>🛒</b>Compras e estoque</button><button class='tile' onclick="page('perfil')"><b>👥</b>Nós</button></div></section>
<section id='feature' class='hide'></section>
</main><div class='bottom hide' id='bottom'><div><button onclick='home()'>🏠</button><button onclick="page('agenda')">📅</button><button onclick="page('lembretes')">🔔</button><button onclick="page('perfil')">👥</button></div></div>
<script>
let step=0;const state=JSON.parse(localStorage.getItem('acasalador')||'{}');const qs=[
{title:'Como é a relação de vocês?',opts:['Casal','Trisal'],key:'tipo'},
{title:'Há quanto tempo vocês estão juntos?',input:'Ex.: 3 anos e 4 meses',key:'tempo'},
{title:'Vocês moram juntos?',opts:['Sim','Não','Às vezes / parcialmente'],key:'moram'},
{title:'Escolha sua cor',colors:['#ff6b6b','#ff8c42','#f5c542','#4caf72','#36a2eb','#7657d5','#d653a5','#222222'],key:'cor'}];
function save(){localStorage.setItem('acasalador',JSON.stringify(state))}function start(){state.name=name.value||'Você';state.phone=phone.value;state.email=email.value;save();login.classList.add('hide');onboard.classList.remove('hide');renderQ()}
function renderQ(){dots.innerHTML=qs.map((_,i)=>`<i class='dot ${i==step?'on':''}'></i>`).join('');let x=qs[step],h=`<div class='card'><h2>${x.title}</h2>`;if(x.opts)h+=x.opts.map(o=>`<button class='choice' onclick="answer('${x.key}','${o}')">${o}</button>`).join('');if(x.input)h+=`<input class='field' id='ans' placeholder='${x.input}'><button class='btn primary' onclick="answer('${x.key}',ans.value)">Continuar</button>`;if(x.colors)h+=`<div class='colors'>${x.colors.map(c=>`<button class='color' style='background:${c}' onclick="answer('cor','${c}')"></button>`).join('')}</div>`;q.innerHTML=h+'</div>'}
function answer(k,v){state[k]=v;if(k==='cor')document.documentElement.style.setProperty('--me',v);save();if(step<qs.length-1){step++;renderQ()}else showApp()}function prev(){if(step>0){step--;renderQ()}else{onboard.classList.add('hide');login.classList.remove('hide')}}
function showApp(){onboard.classList.add('hide');app.classList.remove('hide');bottom.classList.remove('hide');hello.textContent=`Oi, ${state.name||'você'}. ${state.tipo||'Relacionamento'} em modo organização.`}function home(){feature.classList.add('hide');app.classList.remove('hide')}
function page(p){app.classList.add('hide');feature.classList.remove('hide');let h=`<button class='btn ghost' onclick='home()'>← Início</button>`;if(p==='agenda')h+=agenda();if(p==='dinheiro')h+=dinheiro();if(p==='lugares')h+=lugares();if(p==='lembretes')h+=lembretes();if(p==='compras')h+=compras();if(p==='perfil')h+=perfil();feature.innerHTML=h}
function agenda(){let d=['D','S','T','Q','Q','S','S'],cells=d.map(x=>`<b style='text-align:center'>${x}</b>`).join('');for(let i=1;i<=30;i++)cells+=`<div class='day'>${i}${[4,11,19].includes(i)?'<br><i class="mark"></i>':''}</div>`;return `<h2>Nossa agenda</h2><div class='card'><div class='row'><span class='tag'>Setembro 2026</span><span class='tag'>Sua cor identifica seus eventos</span></div><div class='month'>${cells}</div></div><div class='card'><h3>Disponibilidade de trabalho</h3><p class='small'>Cadastre dias e horários de trabalho. Ao criar um evento conflitante, o sistema avisará antes de confirmar.</p><button class='btn primary'>+ Cadastrar horário</button></div>`}
function dinheiro(){return `<h2>Nosso dinheiro</h2><div class='moneytabs'><button class='btn primary'>🔗 Conjunto</button><button class='btn ghost' onclick='alert("Na versão online, esta área exigirá senha/passkey ou biometria do aparelho.")'>🔒 Individual</button></div><div class='card'><h3>Divisões pendentes</h3><p>Gasolina • R$ 100,00</p><div class='row'><button class='btn primary'>Aceitar 50%</button><button class='btn ghost'>Sugerir alteração</button><button class='btn ghost'>Negar</button></div></div><div class='card'><h3>Categorias</h3><p>🚗 Carro <b style='float:right'>R$ 1.150,00</b></p><p>🏠 Casa <b style='float:right'>R$ 0,00</b></p><button class='btn primary'>+ Categoria</button></div>`}
function lugares(){return `<h2>Nossos lugares</h2><div class='card'><p class='small'>As categorias só aparecem depois que tiverem pelo menos um lugar.</p><span class='tag'>🍝 Restaurantes</span><div><h3>Cadastrar lugar</h3><input class='field' placeholder='Nome'><input class='field' placeholder='Instagram'><input class='field' placeholder='Endereço'><input class='field' placeholder='Custo estimado'><select class='field'><option>Deixar em aberto quem paga</option><option>Vamos dividir</option><option>Deixa que eu pago</option></select><button class='btn primary'>Salvar lugar</button></div></div>`}
function lembretes(){return `<h2>Pedidos e lembretes</h2><div class='card'><input class='field' placeholder='Ex.: Passa no mercado e compra pão'><select class='field'><option>Notificar parceiro</option><option>Notificar a mim</option><option>Notificar todos</option></select><label><input type='checkbox'> Notificar até ser realizado</label><select class='field'><option>A cada 15 min</option><option>A cada 20 min</option><option>A cada 35 min</option><option>A cada 1 hora</option><option>Horários definidos</option></select><button class='btn primary'>Criar lembrete</button></div>`}
function compras(){return `<h2>Compras e estoque</h2><div class='card'><h3>Lista compartilhada</h3><input class='field' placeholder='Adicionar item'><button class='btn primary'>Adicionar</button></div><div class='card'><h3>🐾 Kira</h3><p>Tapetinhos <b style='float:right'>30 un.</b></p><p class='small'>O estoque poderá estimar consumo e avisar antes de acabar.</p><button class='btn ghost'>Gerenciar estoque</button></div>`}
function perfil(){return `<h2>Nós</h2><div class='card'><b>${state.name||'Você'}</b><p class='small'>${state.email||''}</p><span class='tag'>${state.tipo||'Relacionamento'}</span> <span class='tag'>${state.moram||''}</span><hr style='border:0;border-top:1px solid var(--line)'><button class='btn primary' onclick='shareInvite()'>Convidar outra pessoa</button></div>`}
async function shareInvite(){let code=Math.random().toString(36).slice(2,10).toUpperCase(),url=location.origin+location.pathname+'?convite='+code,text=`${state.name||'Alguém'} convidou você para entrar no Acasalador. ${url}`;if(navigator.share){try{await navigator.share({title:'Convite Acasalador',text,url})}catch(e){}}else{navigator.clipboard?.writeText(text);alert('Convite copiado!')}}
if(state.cor)document.documentElement.style.setProperty('--me',state.cor);if(state.tipo&&state.cor){login.classList.add('hide');showApp()}
</script></body></html>
